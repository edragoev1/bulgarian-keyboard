<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Bulgarian Phonetic Keyboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%232c3a52%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-family=%22sans-serif%22 font-size=%2238%22 font-weight=%22700%22 fill=%22%23fff%22 text-anchor=%22middle%22%3E%D0%96%3C/text%3E%3C/svg%3E">
<meta name="description" content="Type Bulgarian on a US keyboard: traditional phonetic, with В on V and Ж on W. In your browser; nothing is sent anywhere.">
<style>
:root { --ink: #1d2433; --muted: #4a5263; --primary: #2c3a52; --line: #d0d0d0; --key: #fff; --keyline: #c9ced8; --usmark: #2f5fb3; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 40px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #f6f7f9; }
main { max-width: 980px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { margin: 0 0 16px; color: var(--muted); }
textarea { display: block; width: 100%; height: calc(7.5em + 28px); min-height: calc(7.5em + 28px); padding: 12px 14px; font: 20px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); border: 2px solid var(--line); border-radius: 6px; background: #fff; resize: vertical; }
textarea:focus { outline: none; border-color: var(--primary); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 20px; }
button { width: 112px; height: 36px; padding: 0; font: inherit; font-size: 15px; border-radius: 6px; cursor: pointer; border: 2px solid var(--primary); background: #fff; color: var(--primary); }
button.primary { background: var(--primary); color: #fff; }
button[aria-pressed="false"] { border-color: var(--line); color: var(--muted); }
.checks { margin-right: auto; display: inline-flex; gap: 18px; }
.check { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px 0 0; font-size: 15px; cursor: pointer; user-select: none; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); cursor: pointer; }
textarea.italic { font-style: italic; }
/* Keyboard hidden: the text box takes the picture's place, its height and
   16px margin (the picture is as wide as main, 972 by 334), so the buttons
   stay where they were */
main { container-type: inline-size; }
body.bare textarea { height: calc(7.5em + 28px + 16px + 100cqw * 334 / 972); resize: none; }
svg[hidden] { display: none; }
svg { display: block; width: 100%; height: auto; margin: 0 0 16px; user-select: none; -webkit-user-select: none; }
svg .k rect { fill: var(--key); stroke: var(--keyline); }
svg .k.mod rect { fill: #dfe3ea; }
svg .k.on rect { fill: #c9d6ee; }
svg .k { cursor: pointer; }
svg .k:hover rect { stroke: var(--primary); stroke-width: 2; }
svg .k.off { cursor: default; }
svg .k.off rect, svg .k.off:hover rect { fill: #eceef2; stroke: #c3c8d1; stroke-width: 1; }
svg .k.off .label { fill: #8b92a0; font-weight: 400; }
svg .us { fill: var(--usmark); font-size: 14.5px; font-weight: 600; }
svg .bg { fill: var(--ink); font-size: 20px; font-weight: 600; }
svg .sh { fill: var(--muted); font-size: 18px; }
svg .label { fill: var(--muted); font-size: 14.5px; font-weight: 600; }
footer { margin-top: 20px; color: var(--muted); font-size: 13px; }
footer a { color: var(--primary); }
</style>
</head>
<body>
<main>
<h1>Bulgarian Phonetic Keyboard</h1>
<p class="lead">Type Bulgarian on a US keyboard: traditional phonetic, with В on V and Ж on W. Then copy the text and paste it where you need it.</p>

<svg id="keyboard" viewBox="0 0 972 334" role="group" aria-label="The layout: tap a key to type it"></svg>

<textarea id="text" lang="bg" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Your text"></textarea>

<div class="bar">
  <span class="checks">
    <label class="check"><input id="italic" type="checkbox"> Italic</label>
    <label class="check"><input id="hide" type="checkbox"> Hide keyboard</label>
  </span>
  <button id="bulgarian" type="button" aria-pressed="true">Bulgarian</button>
  <button id="english" type="button" aria-pressed="false">English</button>
  <button id="clear" type="button">Clear</button>
  <button id="copy" class="primary" type="button">Copy</button>
</div>

<footer>Your text stays in this browser: nothing is sent anywhere. Made by <a href="https://pdfjet.com/">PDFjet Software</a>.</footer>
</main>
<script src="layout.js"></script>
<script src="keyboard.js"></script>
</body>
</html>
